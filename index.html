<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Time Cost">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <title>Калькулятор времени</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: stretch;
            align-items: stretch;
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                     env(safe-area-inset-bottom) env(safe-area-inset-left);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .calculator {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            height: 100%;
            min-height: 0;
            background-color: #000;
            border-radius: 0;
            padding: 24px;
            box-shadow: none;
            border: none;
        }

        .top-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 26px 0 0;
            margin-bottom: 10px;
            flex: 0 0 auto;
        }

        .rate-btn {
            background-color: #2c2c2e;
            color: #ffffff;
            border: 1px solid #3a3a3c;
            border-radius: 14px;
            padding: 7px 17px;
            font-size: 1.02rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.05s;
        }

        .rate-btn:active {
            background-color: #3a3a3c;
            transform: scale(0.96);
        }

        .display-container {
            flex: 0 0 22%;
            min-height: 105px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0 0 12px 0;
        }

        .expression {
            color: #a5a5a5;
            font-size: 1.1rem;
            min-height: 1.4rem;
            margin-bottom: 4px;
            word-break: break-all;
            text-align: right;
        }

        .main-display {
            color: #fff;
            font-size: 3.84rem;
            font-weight: 300;
            line-height: 1;
            letter-spacing: -0.5px;
        }

        .sub-text {
            color: #a5a5a5;
            font-size: 1.14rem;
            font-weight: 400;
            margin-top: 6px;
            height: 1.2rem;
        }

        .grid {
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: repeat(5, minmax(0, 1fr));
            gap: 10px;
        }

        button.calc-btn {
            border: none;
            outline: none;
            height: 100%;
            width: auto;
            max-width: 100%;
            aspect-ratio: 1 / 1;
            justify-self: center;
            align-self: center;
            border-radius: 50%;
            font-size: 1.8rem;
            font-weight: 400;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
            padding: 0;
            transition: filter 0.15s ease, transform 0.05s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-width: 0;
            min-height: 0;
        }

        button.calc-btn:active {
            filter: brightness(1.3);
            transform: scale(0.96);
        }

        .btn-gray-wide {
            width: 100%;
            height: 100%;
            aspect-ratio: auto;
            border-radius: 999px;
            background-color: #a5a5a5;
            color: #000;
            grid-column: span 2;
            font-weight: 500;
        }

        .btn-dark {
            background-color: #333333;
            color: #fff;
        }

        .btn-zero {
            grid-column: span 2;
            width: 100%;
            height: 100%;
            aspect-ratio: auto;
            border-radius: 999px;
            justify-content: center;
            padding-left: 0;
        }

        .btn-orange {
            background-color: #ff9f0a;
            color: #fff;
            font-size: 2.16rem;
        }

        .btn-orange.active {
            background-color: #fff;
            color: #ff9f0a;
        }

        /* Вытянутая кнопка ПЛЮС на 2 строки */
        .btn-add-tall {
            grid-row: span 2;
            width: 100%;
            height: 100%;
            aspect-ratio: auto;
            border-radius: 999px;
        }

        @media (max-height: 600px) {
            .calculator { padding: 16px; gap: 6px; }
            .top-bar { padding-top: 18px; }
            .display-container { flex-basis: 19%; min-height: 78px; }
            .main-display { font-size: 3.2rem; }
            .sub-text { font-size: 1.05rem; }
            .grid { gap: 8px; }
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="top-bar">
        <button class="rate-btn" id="rateBtn" onclick="promptRate()">$0.00/h</button>
    </div>

    <div class="display-container">
        <div class="expression" id="expression"></div>
        <div class="main-display" id="display">0:00</div>
        <div class="sub-text" id="subDisplay">$0.00</div>
    </div>

    <div class="grid">
        <!-- Верхняя строчка управления -->
        <button class="calc-btn btn-gray-wide" onclick="pressAC()">AC</button>
        <button class="calc-btn btn-gray-wide" onclick="pressBackspace()">❮</button>

        <!-- Ряд 1: 7 8 9 - -->
        <button class="calc-btn btn-dark" onclick="pressNum('7')">7</button>
        <button class="calc-btn btn-dark" onclick="pressNum('8')">8</button>
        <button class="calc-btn btn-dark" onclick="pressNum('9')">9</button>
        <button class="calc-btn btn-orange" id="op-subtract" onclick="setOperator('-')">−</button>

        <!-- Ряд 2: 4 5 6 и ПЛЮС (занимает 2 строки вниз) -->
        <button class="calc-btn btn-dark" onclick="pressNum('4')">4</button>
        <button class="calc-btn btn-dark" onclick="pressNum('5')">5</button>
        <button class="calc-btn btn-dark" onclick="pressNum('6')">6</button>
        <button class="calc-btn btn-orange btn-add-tall" id="op-add" onclick="setOperator('+')">+</button>

        <!-- Ряд 3: 1 2 3 -->
        <button class="calc-btn btn-dark" onclick="pressNum('1')">1</button>
        <button class="calc-btn btn-dark" onclick="pressNum('2')">2</button>
        <button class="calc-btn btn-dark" onclick="pressNum('3')">3</button>

        <!-- Ряд 4: 0 (2 столбика), 00 и = -->
        <button class="calc-btn btn-dark btn-zero" onclick="pressNum('0')">0</button>
        <button class="calc-btn btn-dark" onclick="pressNum('00')">00</button>
        <button class="calc-btn btn-orange" id="op-equals" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let rawDigits = "";
    let previousMins = null;
    let currentOperator = null;
    let isNewInput = true;
    function readSavedRate() {
        try {
            return parseFloat(localStorage.getItem('time_calc_rate')) || 0;
        } catch (error) {
            return 0;
        }
    }
    let hourlyRate = readSavedRate();

    const displayEl = document.getElementById('display');
    const subDisplayEl = document.getElementById('subDisplay');
    const expressionEl = document.getElementById('expression');
    const rateBtnEl = document.getElementById('rateBtn');

    function updateRateButton() {
        rateBtnEl.textContent = `$${hourlyRate.toFixed(2)}/h`;
    }

    function promptRate() {
        const input = prompt("Введите стоимость 1 часа работы ($):", hourlyRate ? hourlyRate : "");
        if (input !== null) {
            const parsed = parseFloat(input.replace(',', '.'));
            if (!isNaN(parsed) && parsed >= 0) {
                hourlyRate = parsed;
                try {
                    localStorage.setItem('time_calc_rate', String(hourlyRate));
                } catch (error) {
                    // The calculator still works if browser storage is unavailable.
                }
                updateRateButton();
                updateDisplay();
            }
        }
    }

    function digitsToMinutes(digitsStr) {
        if (!digitsStr || digitsStr === "0") return 0;
        const padded = digitsStr.padStart(3, '0');
        const h = parseInt(padded.slice(0, -2), 10) || 0;
        const m = parseInt(padded.slice(-2), 10) || 0;
        return h * 60 + m;
    }

    function formatTimeDisplay(digitsStr) {
        if (!digitsStr) return "0:00";
        const padded = digitsStr.padStart(3, '0');
        const h = parseInt(padded.slice(0, -2), 10) || 0;
        const mStr = padded.slice(-2);
        return `${h}:${mStr}`;
    }

    function minutesToDigitsStr(totalMins) {
        const isNegative = totalMins < 0;
        const absMins = Math.abs(totalMins);
        const h = Math.floor(absMins / 60);
        const m = absMins % 60;
        const mStr = m < 10 ? '0' + m : '' + m;
        return (isNegative ? "-" : "") + `${h}${mStr}`;
    }

    function updateDisplay() {
        const mins = digitsToMinutes(rawDigits);
        
        if (rawDigits === "") {
            displayEl.textContent = "0:00";
        } else {
            displayEl.textContent = formatTimeDisplay(rawDigits);
        }

        const cost = (mins / 60) * hourlyRate;
        subDisplayEl.textContent = `$${cost.toFixed(2)}`;
        adjustFontSize();
    }

    function adjustFontSize() {
        const len = displayEl.textContent.length;
        if (len > 8) {
            displayEl.style.fontSize = "2.1rem";
        } else if (len > 6) {
            displayEl.style.fontSize = "2.6rem";
        } else {
            displayEl.style.fontSize = "3.2rem";
        }
    }

    function pressNum(numStr) {
        if (isNewInput) {
            rawDigits = "";
            isNewInput = false;
        }

        if (rawDigits.length >= 7) return;
        if (rawDigits === "" && (numStr === "0" || numStr === "00")) return;

        rawDigits += numStr;
        updateDisplay();
        highlightOperator(null);
    }

    function pressBackspace() {
        if (isNewInput) return;
        rawDigits = rawDigits.slice(0, -1);
        updateDisplay();
    }

    function pressAC() {
        rawDigits = "";
        previousMins = null;
        currentOperator = null;
        isNewInput = true;
        expressionEl.textContent = "";
        updateDisplay();
        highlightOperator(null);
    }

    function setOperator(op) {
        const currentMins = digitsToMinutes(rawDigits);

        if (previousMins !== null && !isNewInput && currentOperator) {
            calculateIntermediate();
        } else {
            previousMins = currentMins;
        }

        currentOperator = op;
        isNewInput = true;
        
        const formattedCurrent = formatTimeDisplay(rawDigits || "0");
        expressionEl.textContent = `${formattedCurrent} ${op}`;
        highlightOperator(op);
    }

    function calculateIntermediate() {
        const currentMins = digitsToMinutes(rawDigits);
        if (currentOperator === '+') {
            previousMins += currentMins;
        } else if (currentOperator === '-') {
            previousMins -= currentMins;
        }
        rawDigits = minutesToDigitsStr(previousMins);
        updateDisplay();
    }

    function calculate() {
        if (currentOperator === null || previousMins === null) return;

        const currentMins = digitsToMinutes(rawDigits);
        const op = currentOperator;
        const prevFormatted = formatTimeDisplay(minutesToDigitsStr(previousMins));
        const currFormatted = formatTimeDisplay(rawDigits);

        let resultMins = 0;
        if (op === '+') {
            resultMins = previousMins + currentMins;
        } else if (op === '-') {
            resultMins = previousMins - currentMins;
        }

        expressionEl.textContent = `${prevFormatted} ${op} ${currFormatted} =`;
        rawDigits = minutesToDigitsStr(resultMins);
        updateDisplay();

        previousMins = null;
        currentOperator = null;
        isNewInput = true;
        highlightOperator(null);
    }

    function highlightOperator(op) {
        document.getElementById('op-add').classList.remove('active');
        document.getElementById('op-subtract').classList.remove('active');
        if (op === '+') document.getElementById('op-add').classList.add('active');
        if (op === '-') document.getElementById('op-subtract').classList.add('active');
    }

    document.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') {
            pressNum(e.key);
        } else if (e.key === '+') {
            setOperator('+');
        } else if (e.key === '-') {
            setOperator('-');
        } else if (e.key === 'Enter' || e.key === '=') {
            e.preventDefault();
            calculate();
        } else if (e.key === 'Backspace') {
            pressBackspace();
        } else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') {
            pressAC();
        }
    });

    // Optional haptic feedback where the browser exposes the Vibration API.
    // iPhone Safari may not support this API; visual press feedback remains enabled.
    function tryHapticFeedback() {
        if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
            try { navigator.vibrate(8); } catch (error) {}
        }
    }

    document.querySelector('.calculator').addEventListener('click', function (event) {
        if (event.target.closest('button')) tryHapticFeedback();
    });

    // Register the offline cache when served from HTTPS (e.g. GitHub Pages).
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('./service-worker.js').catch(function () {});
        });
    }

    updateRateButton();
    updateDisplay();
</script>

</body>
</html>
